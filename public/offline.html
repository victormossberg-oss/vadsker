<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Vadsker – offline</title>
    <style>
      :root {
        color-scheme: light;
        --accent: #c8102e;
        --ink: #16161a;
        --muted: #6b7280;
        --line: #e3e3e0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #ffffff;
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
        border-top: 3px double var(--ink);
        border-bottom: 1px solid var(--line);
        padding: 28px 0 32px;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 44px;
        line-height: 1;
      }

      span {
        color: var(--accent);
      }

      p {
        margin: 18px auto 0;
        max-width: 320px;
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vad<span>sker</span></h1>
      <p>Du verkar vara offline. Anslut till internet igen för att hämta senaste nyheterna.</p>
    </main>
  </body>
</html>
